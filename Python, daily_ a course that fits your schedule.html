L('pc1','pc','What a computer actually does',10,String.raw`
A computer follows instructions, very fast. Four parts matter to a programmer:

- **The CPU** is the worker. It follows instructions one after another.
- **Memory (RAM)** is the short-term workspace. It is fast, and it empties when the power goes off.
- **Storage (SSD)** is long-term. Your files live here and stay put.
- **The operating system** (Windows, macOS, Linux) is the manager. It runs programs and hands them the screen, files and network.

## Programs and code
A program is a list of instructions. People write **source code**, which is plain text. The CPU can't read that directly, so something has to translate it.

Python uses an **interpreter**: a program that reads your text file and carries out what it says, line by line.

>> You don't need to memorize hardware. Keep one picture in mind: code is text, the interpreter runs it, it uses memory while it runs, and it saves results to storage.
`,[

L('pc2','pc','Files, folders and the terminal',15,String.raw`
Files live inside folders, and folders live inside other folders. A **path** is the address of a file:

~~~txt
macOS / Linux:  /Users/sam/Documents/notes.txt
Windows:        C:\Users\Sam\Documents\notes.txt
~~~

The end of a file name, like ~.py~ or ~.txt~, is its **extension**. Python files end in ~.py~.

## The terminal
The **terminal** is a window where you type commands instead of clicking. Programmers use it constantly because it is fast and exact. On Windows, search for **PowerShell** or **Terminal**. On macOS, open **Terminal**.

Four commands cover most of what you need:

- ~cd folder~ moves into a folder, and ~cd ..~ moves up one level
- ~ls~ lists what is in the current folder (~dir~ also works on Windows)
- ~mkdir name~ makes a new folder
- ~pwd~ prints where you are (macOS and Linux; Windows PowerShell uses ~pwd~ too)

~~~sh
cd Documents
mkdir python-course
cd python-course
~~~

>> The terminal can't hurt you just by being open. Be careful only with delete commands (~rm~, ~del~), because they skip the recycle bin.
`,[

L('pc3','pc','Installing Python and an editor',20,String.raw`
First, check whether Python is already installed. Open your terminal and type:

~~~sh
python --version
~~~

On macOS and Linux you may need ~python3 --version~ instead. You want **Python 3.14 or newer**. Python 3.13 works fine too. Avoid anything older than 3.11, and note that Python 3.10 reaches end of life in October 2026.

## Installing
- **Simple route:** download the installer from python.org/downloads. On Windows, tick **Add python.exe to PATH** on the first screen.
- **Modern route:** ~uv~ is a fast tool that installs Python versions and manages projects. After installing uv, ~uv python install 3.14~ fetches Python for you.

## An editor
Use **VS Code** with its Python extension, or **PyCharm**. Both are free and both highlight mistakes as you type.

## Your first run
Create a file named ~hello.py~ with this single line:

~~~
print("Hello, world!")
~~~

Then run it from the folder that contains it:

~~~sh
python hello.py
~~~

## The interactive prompt
Typing just ~python~ opens the **REPL**, a live prompt marked ~>>>~. Type a line, press Enter, and Python answers immediately. It's perfect for quick experiments. Type ~exit()~ to leave. Recent versions add colour and let you paste several lines at once.

L('b1','basics','Your first programs: print and comments',15,String.raw`
The ~print()~ function shows something on screen. Text goes in quotes. Numbers don't.

~~~
print("Hello, world!")
print("Python", "is", "fun")
print(2 + 3)
~~~

Output:

~~~txt
Hello, world!
Python is fun
5
~~~

Text in quotes is called a **string**. The string ~"2 + 3"~ prints as written, but the bare expression ~2 + 3~ gets calculated first.

## Comments
Anything after ~#~ is ignored by Python. Use comments to explain why, not what.

~~~
# This line is for humans only
print("Done")  # this part too
~~~

## Reading mistakes
Python is case-sensitive, so ~Print~ is not ~print~. If you forget a closing quote, Python stops and points at the line. Read the message; it is usually trying to help.

L('b3','basics','Numbers and math',12,String.raw`
Python works as a calculator.

~~~

~~~

The remainder operator ~%~ looks odd but is very useful. ~n % 2 == 0~ is a quick test for even numbers.

~~~

This happens in every language. Use ~round()~ when you display money or measurements.

L('f4','flow','break, continue and loop patterns',12,String.raw`
Two keywords give you finer control:

- ~break~ leaves the loop immediately
- ~continue~ skips to the next round

~~~
for i in range(5):

    print(i)      # prints 0 1 2

for i in range(5):
    if i == 2:
        continue
    print(i)      # prints 0 1 3 4
~~~

## Patterns worth knowing
**Counting** how many items match:

~~~
count = 0
for n in range(1, 21):

biggest = 0

## Tuples
A **tuple** is like a list that can't change. Use it for small fixed groups such as coordinates.

Python functions often return tuples, and unpacking makes that tidy.

## Sets
A **set** holds unique values with no order. Duplicates vanish.

~~~
tags = {"python", "code", "python"}

~~~

Sets also do maths:

~~~
a = {1, 2, 3}
b = {3, 4}

~~~

A missing key raises a ~KeyError~. ~.get()~ returns a default instead:

A **list comprehension** builds a list in one line.

squares = [n * n for n in range(5)]

Read it as: "give me ~n * n~ for each ~n~ in the range". The optional ~if~ filters.

L('fn1','funcs','Defining functions',15,String.raw`
A **function** is a named, reusable block of code. You write it once and use it anywhere.

~~~
def greet(name):

greet("Ada")

~~~

- ~def~ starts the definition
- ~name~ is a **parameter**, a placeholder for what you pass in
- The indented lines are the **body**
- Writing ~greet("Ada")~ **calls** it. Nothing happens until you call.

## Why bother?
Functions remove repetition and give chunks of logic a readable name. A good rule: if you copy and paste code, turn it into a function.

## Docstrings
A string on the first line documents what the function does:

~~~
def greet(name):
    """Print a friendly greeting."""
    print(f"Hello, {name}!")
~~~

L('fn3','funcs','Scope and writing good functions',12,String.raw`
Variables made inside a function are **local**. They disappear when it finishes.

~~~
def make_msg():
    msg = "hello"
    return msg

make_msg()
print(msg)   # NameError: msg is not defined
~~~

Functions can read outer variables, but changing them from inside is usually a bad idea. Pass things in and return things out instead.

## Habits of good functions
- **One job** each, with a name that says it (~calculate_tax~, not ~do_stuff~)
- **Inputs as parameters, results as returns**
- Short enough to read without scrolling

## The mutable default trap
~~~
def add_item(item, items=[]):   # BAD: one list shared forever
    items.append(item)
    return items

def add_item(item, items=None): # GOOD
    if items is None:
        items = []
    items.append(item)
    return items
~~~

The default value is created once, when the function is defined, so a list default keeps growing between calls.

Any ~.py~ file is a module. If you save ~tools.py~ with a function ~double~, another file can write ~from tools import double~.

~~~

The last two lines mean "run ~main()~ only when this file is started directly, not when it is imported".

L('r1','real','Reading errors and tracebacks',12,String.raw`
Every programmer sees errors all day. The skill is reading them.

~~~txt
Traceback (most recent call last):
  File "demo.py", line 2, in <module>
    print(total)
NameError: name 'total' is not defined
~~~

**Read from the bottom up.** The last line names the error type and explains it. Above it, Python shows the file and line number where it happened.

## The usual suspects
- ~SyntaxError~: the code is malformed (missing colon, bracket or quote)
- ~IndentationError~: indentation is uneven
- ~NameError~: you used a name that doesn't exist (often a typo)
- ~TypeError~: wrong kind of value, like adding text and a number
- ~ValueError~: right type but unusable value, like ~int("abc")~

2. Go to the line number mentioned.
3. Check what the variables hold with a ~print()~.

L('r2','real','Handling errors with try and except',12,String.raw`
Sometimes errors are expected, such as a user typing letters instead of a number. **Exceptions** let you handle them gracefully.

~~~
while True:
    text = input("Number: ")
    try:
        n = int(text)
        break
    except ValueError:
        print("That's not a number, try again.")
print(n * 2)
~~~

If something inside ~try~ raises a ~ValueError~, Python jumps to ~except~ and carries on instead of crashing.

## Good habits
- Catch **specific** errors (~except ValueError~), not everything. A bare ~except:~ hides real bugs.
- Keep the ~try~ block small.
- You can raise your own errors:

~~~
def set_age(age):
    if age < 0:
        raise ValueError("age cannot be negative")
    return age
~~~

There are also ~else~ (runs if no error happened) and ~finally~ (always runs, good for cleanup).

L('o1','oop','Classes and objects',20,String.raw`
A **class** is a blueprint. An **object** (or instance) is one thing made from it.

~~~
class Dog:
    def __init__(self, name):
        self.name = name

    def bark(self):
        return f"{self.name} says woof"

rex = Dog("Rex")
fido = Dog("Fido")
print(rex.bark())    # Rex says woof
print(fido.name)     # Fido
~~~

- ~__init__~ runs when you create an object. It sets up its **attributes**.
- ~self~ means "this particular object". Every method receives it first.
- Functions inside a class are called **methods**.

## Objects keep state
~~~
class Counter:
    def __init__(self):
        self.value = 0

    def up(self):
        self.value += 1

c = Counter()
c.up()
c.up()
print(c.value)   # 2
~~~

Two counters have separate values. That combination of data and the actions on it is the heart of object-oriented programming.

L('o3','oop','Type hints',12,String.raw`
Python figures out types while running, but you can add **type hints** that document your intent.

~~~
def greet(name: str) -> str:
    return f"Hello, {name}"

def total(prices: list[float]) -> float:
    return sum(prices)

def find(names: list[str], target: str) -> int | None:
    if target in names:
        return names.index(target)
    return None
~~~

- ~name: str~ says the parameter should be text
- ~-> str~ says the function returns text
- ~int | None~ means "an int or None"
- ~list[float]~ and ~dict[str, int]~ describe containers

## Important
Python does **not** enforce hints when the program runs. They help **you** and your tools: editors and checkers such as mypy or pyright warn you about mismatches before you run anything.

In Python 3.14, annotations are evaluated lazily, so you can refer to a class that is defined later without quoting its name.

>> Hints are optional. Adding them to function signatures is the highest-value habit.

L('m1','modern','match: pattern matching',10,String.raw`
Since Python 3.10 there is a **match** statement. It's like ~if/elif~ but can look at the shape of data.

~~~
def describe(command):
    match command.split():
        case ["go", direction]:
            return f"Going {direction}"
        case ["take", item]:
            return f"Taking {item}"
        case ["quit"]:
            return "Bye"
        case _:
            return "Unknown command"

print(describe("go north"))    # Going north
print(describe("dance"))       # Unknown command
~~~

The pattern ~["go", direction]~ matches a two-item list whose first item is ~"go"~, and captures the second as ~direction~. The underscore ~_~ matches anything, so it acts as the default.

## Simple values
~~~
match status:
    case 200:
        print("OK")
    case 404 | 410:
        print("Gone")
    case _:
        print("Other")
~~~

>> Use ~match~ when you are taking apart structured data, such as commands or dictionaries. For simple true/false checks, ~if~ is still better.

L('m2','modern','What is new: Python 3.14 and beyond',12,String.raw`
Python releases a new version **every October**, and each gets about five years of support. You're learning on the current generation, so here's what recent releases brought, in plain words.

## Python 3.14 (October 2025)
- **Template strings (t-strings).** Written like f-strings with a ~t~ prefix, they don't produce a plain string. They produce a **Template** object that libraries can process safely, for example to escape user input before building HTML or SQL.
- **Free-threaded Python is officially supported.** A special build can run threads truly in parallel, without the old global lock. It's optional and still maturing, and you don't need it as a beginner.
- **Deferred annotations.** Type hints are evaluated lazily, so forward references just work.
- **Friendlier tooling.** The interactive prompt is more helpful, and error messages keep getting clearer.
- **Standard library additions**, such as Zstandard compression, plus an experimental JIT compiler for speed research.

## What this means for you
Everything in this course runs on 3.14, and on 3.13 too. Python 3.15 is scheduled for around October 2026, and because Python protects backward compatibility, what you learn stays valid.

## Keeping current
- Skim "What's New" on docs.python.org each October
- Use ~uv~ or your installer to update Python
- Move off versions that have reached end of life

  let html='',para=[],list=[],tip=[],fence=null,buf=[];
  const flush=()=>{
    if(para.length){html+='<p>'+inline(para.join(' '))+'</p>';para=[]}
    if(list.length){html+='<ul>'+list.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ul>';list=[]}
    if(tip.length){html+='<div class="tip">'+inline(tip.join(' '))+'</div>';tip=[]}
  };
  for(const line of lines){
    if(fence!==null){
      if(line.trim()==='~~~'){html+=codeBlock(buf.join('\n'),fence);fence=null;buf=[]}
      else buf.push(line);
      continue;
    }
    const f=line.match(/^~~~(\w*)\s*$/);
    if(f){flush();fence=f[1]||'py';buf=[];continue}
    if(line.trim()===''){flush();continue}
    if(line.startsWith('## ')){flush();html+='<h3>'+inline(line.slice(3))+'</h3>';continue}
    if(line.startsWith('- ')){if(para.length||tip.length)flush();list.push(line.slice(2));continue}
    if(line.startsWith('>> ')){if(para.length||list.length)flush();tip.push(line.slice(3));continue}
    if(list.length){flush()}
    para.push(line);
  }
  flush();
  return html;
}
function fmtMin(m){const h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+r+' min':'')):(r+' min')}
function pad(n){return String(n).padStart(2,'0')}
function todayIso(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseIso(s){return new Date(s+'T00:00:00')}
function fmtDate(d){return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function sessionDates(n,perWeek,startIso){
  const allowed={7:[0,1,2,3,4,5,6],5:[1,2,3,4,5],3:[1,3,5]}[perWeek]||[1,2,3,4,5];
  const out=[];const d=parseIso(startIso);
  while(out.length<n){if(allowed.includes(d.getDay()))out.push(new Date(d));d.setDate(d.getDate()+1)}
  return out;
}
function pack(ids,cap){
  const sessions=[];let cur=[],sum=0;
  for(const id of ids){
    const m=LBY[id].min;
    if(cur.length&&sum+m>cap+3){sessions.push(cur);cur=[];sum=0}
    cur.push(id);sum+=m;
  }
  if(cur.length)sessions.push(cur);
  return sessions;
}

/* ============ STATE ============ */
const KEY='pythondaily.v1';
function defaults(){return{goal:'explore',exp:null,answers:{},skip:[],minutes:45,perWeek:5,start:null,plan:null,done:{},picks:{},open:{}}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(defaults(),JSON.parse(r))}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let V={name:S.plan?'plan':'home',stage:0,qi:0,n:0,id:null,confirm:false};

function activeIds(){return LESSONS.filter(l=>l.always||!S.skip.includes(l.topic)).map(l=>l.id)}
function remainingIds(){return activeIds().filter(id=>!S.done[id])}
function computeSkip(){
  const skip=[];let ok=true;
  for(const t of TOPICS.filter(t=>t.skip)){
    const qs=PLACEMENT.filter(p=>p.t===t.id);
    const right=qs.filter(p=>S.answers[p.id]===p.a).length;
    const need=qs.length-(qs.length>=3?1:0);
    if(ok&&right>=need)skip.push(t.id);else ok=false;
  }
  return skip;
}

/* ============ VIEWS ============ */
function go(name,extra){Object.assign(V,{name:name,confirm:false},extra||{});render(false)}
function update(){render(true)}

function renderMini(){
  const el=document.getElementById('mini');
  if(!S.plan){el.innerHTML='';return}
  const ids=activeIds();const d=ids.filter(i=>S.done[i]).length;

  el.innerHTML='<span>'+d+' of '+ids.length+' lessons</span><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+pct+'%"></span></div>'
   +(S.plan?'<button class="link" data-a="plan">My plan</button>':'');
}

function vHome(){
  return '<section class="hero"><div>'
  +'<h1>Learn Python at the pace you can keep.</h1>'
  +'<p class="lead">Answer 15 short questions about computers and code. We skip what you already know and split the rest into daily sessions that fit the time you actually have.</p>'
  +'<div class="cta-row"><button class="btn" data-a="start">Find my starting point</button>'
  +'<button class="btn ghost" data-a="brandnew">I\'m brand new, skip the questions</button></div>'
  +'<span class="stamp">Updated for Python 3.14 (October 2026)</span></div>'
  +'<pre class="codecard" aria-label="Decorative example of how the plan is built"><code><span class="cm"># 15 questions in, a plan out</span>\n<span class="k">you</span> = {<span class="s">"level"</span>: <span class="s">"new"</span>, <span class="s">"minutes_a_day"</span>: <span class="n">30</span>}\n<span class="k">plan</span> = build_course(you)\n\n<span class="b">print</span>(plan[<span class="n">0</span>])\n<span class="cm"># Session 1: what a computer does,</span>\n<span class="cm">#   files, the terminal</span>\n<span class="b">print</span>(plan[-<span class="n">1</span>])\n<span class="cm"># Session '+Math.ceil(LESSONS.reduce((a,l)=>a+l.min,0)/30)+': your finished project</span></code></pre></section>'
  +'<div class="facts">'
  +'<div><h3>It starts from zero</h3><p>Lesson one explains what a computer does. No background assumed, and no jargon left unexplained.</p></div>'
  +'<div><h3>It adapts to you</h3><p>Already comfortable with variables or loops? The questions find that, and those lessons drop out of your plan.</p></div>'
  +'<div><h3>It ends with a project</h3><p>'+LESSONS.length+' short lessons, about '+fmtMin(LESSONS.reduce((a,l)=>a+l.min,0))+' of reading and practice, finishing with a small program you built yourself.</p></div>'
  +'</div>';
}

function vProfile(){
  const exps=[['none','I have never written code'],['some','I\'ve tried a bit (tutorials, copy and paste)'],['other','I code in another language']];
  const goals=[['web','Build websites and apps'],['data','Analyse data'],['auto','Automate boring tasks'],['ai','Work with AI'],['explore','Just exploring']];
  return '<div class="qwrap"><h2 class="t">Two quick things first</h2><p class="muted">These help us shape your plan. Neither is graded.</p>'
  +'<h3 class="s" style="margin-top:26px">Where are you starting?</h3><div class="chips">'
  +exps.map(e=>'<button class="chip" data-a="exp" data-v="'+e[0]+'" aria-pressed="'+(S.exp===e[0])+'">'+e[1]+'</button>').join('')+'</div>'
  +'<h3 class="s">What do you want Python for?</h3><div class="chips">'
  +goals.map(g=>'<button class="chip" data-a="goal" data-v="'+g[0]+'" aria-pressed="'+(S.goal===g[0])+'">'+g[1]+'</button>').join('')+'</div>'
  +'<div class="panel" style="background:var(--yellow-soft);border-color:var(--yellow)"><strong class="fam">A tip for the questions:</strong> choose <em>I don\'t know yet</em> whenever you are unsure. Guessing would skip lessons you need, and an honest answer makes the plan better.</div>'
  +'<div class="cta-row" style="margin-top:24px"><button class="btn" data-a="beginquiz" '+(S.exp?'':'disabled')+'>Start the questions</button></div></div>';
}

function vQuiz(){
  const i=V.qi,p=PLACEMENT[i],total=PLACEMENT.length;
  return '<div class="qwrap"><div class="qmeta"><span>Question '+(i+1)+' of '+total+'</span><span>'+TN[p.t]+'</span></div>'
  +'<div class="bar" style="width:100%"><span style="width:'+(i/total*100)+'%"></span></div>'
  +'<div class="qtext">'+inline(p.q)+'</div>'
  +(p.code?codeBlock(p.code,'py'):'')
  +'<div class="opts">'+p.o.map((o,k)=>'<button class="opt" data-a="opt" data-i="'+k+'"><span class="ix">'+'ABCD'[k]+'</span><span>'+inline(o)+'</span></button>').join('')
  +'<button class="opt dunno" data-a="opt" data-i="-1">I don\'t know yet</button></div>'
  +(i>0?'<p style="margin-top:20px"><button class="link" data-a="qback">Back</button></p>':'')+'</div>';
}

function paceCalc(){
  const ids=V.replan?remainingIds():activeIds();
  const pk=pack(ids,S.minutes);
  const total=ids.reduce((a,id)=>a+LBY[id].min,0);
  const dates=pk.length?sessionDates(pk.length,S.perWeek,todayIso()):[];
  return{ids,pk,total,last:dates[dates.length-1]};
}
function vSetup(){
  const skippable=TOPICS.filter(t=>t.skip);
  const pc=paceCalc();
  const answered=Object.keys(S.answers).length>0;
  let intro;
  if(V.replan)intro='<p class="muted">Adjust your pace. Your finished lessons stay finished, and the remaining ones get re-split.</p>';
  else if(!answered)intro='<p class="muted">You chose to start from the beginning. You can still mark any module below as already known.</p>';
  else{
    const right=PLACEMENT.filter(p=>S.answers[p.id]===p.a).length;
    intro='<p>You answered <strong>'+right+' of '+PLACEMENT.length+'</strong> correctly. '
      +(S.skip.length?'We\'ll skip the modules you clearly know, and you can adjust that here.':'We\'ll start at the beginning so nothing is missing. That\'s a perfectly good place to be.')+'</p>';
  }
  return '<div class="narrow"><h2 class="t">'+(V.replan?'Change your pace':'Build your plan')+'</h2>'+intro
  +'<div class="panel" style="margin-top:20px"><h3 class="s">Modules I already know</h3>'
  +skippable.map(t=>'<label class="check"><input type="checkbox" data-a="togskip" data-t="'+t.id+'" '+(S.skip.includes(t.id)?'checked':'')+'><span><strong class="fam">'+t.name+'</strong><br><span class="muted" style="font-size:.95rem">'+LESSONS.filter(l=>l.topic===t.id).map(l=>l.title).join(', ')+'</span></span></label>').join('')
  +'</div>'
  +'<div class="panel"><h3 class="s">How much time can you give each session?</h3><div class="chips">'
  +[20,30,45,60,90,120].map(m=>'<button class="chip" data-a="minutes" data-v="'+m+'" aria-pressed="'+(S.minutes===m)+'">'+(m>=60?(m/60)+(m===60?' hour':' hours'):m+' min')+'</button>').join('')+'</div>'
  +'<h3 class="s">How many days a week?</h3><div class="chips" style="margin-bottom:6px">'
  +[[3,'3 days (Mon, Wed, Fri)'],[5,'5 days (weekdays)'],[7,'Every day']].map(d=>'<button class="chip" data-a="perweek" data-v="'+d[0]+'" aria-pressed="'+(S.perWeek===d[0])+'">'+d[1]+'</button>').join('')+'</div></div>'
  +'<div class="panel"><h3 class="s">Your plan</h3>'
  +(pc.pk.length?'<div class="summary"><div><b>'+pc.pk.length+'</b><span>sessions</span></div><div><b>'+fmtMin(pc.total)+'</b><span>of learning in total</span></div><div><b>'+fmtDate(pc.last)+'</b><span>estimated finish if you start today</span></div></div>':'<p>Nothing left to schedule. You have finished every active lesson.</p>')
  +'</div>'
  +'<div class="cta-row" style="margin-top:22px"><button class="btn" data-a="build" '+(pc.pk.length?'':'disabled')+'>'+(V.replan?'Update my plan':'Start my course')+'</button>'
  +(V.replan?'<button class="btn ghost" data-a="plan">Cancel</button>':'')+'</div></div>';
}

function sessionState(s,idx,nextIdx){
  const all=s.every(id=>S.done[id]);
  return all?'done':(idx===nextIdx?'now':'todo');
}
function vPlan(){
  const ids=activeIds();const done=ids.filter(i=>S.done[i]);
  const doneMin=done.reduce((a,i)=>a+LBY[i].min,0),totMin=ids.reduce((a,i)=>a+LBY[i].min,0);
  const plan=S.plan||[];
  const dates=sessionDates(Math.max(plan.length,1),S.perWeek,S.start||todayIso());
  let nextIdx=plan.findIndex(s=>!s.every(id=>S.done[id]));
  let html='<div>';
  if(nextIdx===-1){
    html+='<div class="win"><h3>You finished the whole course.</h3><p>Every lesson and the capstone are done. Keep the momentum: pick a library from the paths lesson, and start your next small project this week.</p></div>';
  }else{
    const s=plan[nextIdx];const mins=s.reduce((a,id)=>a+LBY[id].min,0);
    html+='<div class="next"><div><span class="fam muted" style="color:inherit;opacity:.8">Up next · '+fmtDate(dates[nextIdx])+' · about '+fmtMin(mins)+'</span><h2>Session '+(nextIdx+1)+'</h2><p>'+s.map(id=>LBY[id].title).join(' · ')+'</p></div><button class="btn" data-a="opensession" data-n="'+nextIdx+'">'+(s.some(id=>S.done[id])?'Continue session':'Start session')+'</button></div>';
  }
  html+='<div class="stats"><div><b>'+done.length+' / '+ids.length+'</b><span>lessons finished</span></div><div><b>'+fmtMin(Math.max(totMin-doneMin,0))+'</b><span>left to go</span></div><div><b>'+S.minutes+' min</b><span>per session, '+(S.perWeek===7?'every day':S.perWeek+' days a week')+'</span></div></div>';
  html+='<div class="sessions">'+plan.map((s,i)=>{
    const st=sessionState(s,i,nextIdx);const mins=s.reduce((a,id)=>a+LBY[id].min,0);
    return '<button class="srow" data-a="opensession" data-n="'+i+'"><span class="sn">Session '+(i+1)+'<span class="sd">'+fmtDate(dates[i])+'</span></span>'
     +'<ul>'+s.map(id=>'<li class="'+(S.done[id]?'done':'')+'">'+LBY[id].title+' <span class="muted">('+LBY[id].min+' min)</span></li>').join('')+'</ul>'
     +'<span class="state '+st+'">'+(st==='done'?'Done':st==='now'?'Next':fmtMin(mins))+'</span></button>';
  }).join('')+'</div>';
  const sk=LESSONS.filter(l=>!l.always&&S.skip.includes(l.topic));
  if(sk.length)html+='<details class="skipped"><summary>Skipped because you know them ('+sk.length+' lessons)</summary><ul>'+sk.map(l=>'<li><button class="link" data-a="openlesson" data-id="'+l.id+'">'+l.title+'</button></li>').join('')+'</ul><p class="muted" style="font-size:.95rem">Open any of them for a refresher. You can also change your choices under Change pace.</p></details>';
  html+='<div class="tools"><button class="btn ghost small" data-a="replan">Change pace</button><button class="btn ghost small" data-a="retake">Retake the questions</button>'
   +(V.confirm?'<span class="fam">Erase all progress? <button class="link" data-a="reset">Yes, erase</button> · <button class="link" data-a="cancelreset">No</button></span>':'<button class="btn ghost small" data-a="askreset">Start over</button>')+'</div></div>';
  return html;
}

function qBlock(key,q,label){
  const pick=S.picks[key];const has=pick!==undefined;
  return '<div class="check-block" style="border-top:0;padding-top:0;margin-top:14px"><div class="qtext">'+inline(q.q)+'</div>'+(q.code?codeBlock(q.code,'py'):'')
  +'<div class="opts">'+q.o.map((o,k)=>{
    let cls='opt';if(has&&k===pick)cls+=k===q.a?' ok':' bad';
    return '<button class="'+cls+'" data-a="pick" data-k="'+key+'" data-i="'+k+'"><span class="ix">'+'ABCD'[k]+'</span><span>'+inline(o)+'</span></button>';
  }).join('')+'</div>'
  +(has?'<div class="fb '+(pick===q.a?'ok':'bad')+'" role="status"><strong>'+(pick===q.a?'Correct. ':'Not quite. ')+'</strong>'+inline(pick===q.a?q.w:'Have another look. '+q.w)+'</div>':'')+'</div>';
}

function lessonHTML(l,ctx){
  const isDone=!!S.done[l.id];
  let html='<article class="lesson" id="L-'+l.id+'"><p class="mod">'+l.mod+'</p><h2>'+l.title+'</h2><span class="time">About '+l.min+' minutes, practice included</span><div class="prose" style="margin-top:18px">'+md(l.body)+'</div>';
  if(l.id==='m4'){
    const extra={web:'**Your goal, web:** start with Flask or FastAPI. Build a tiny page or API that returns your to-do list as JSON.',data:'**Your goal, data:** install Jupyter and pandas (or Polars), load a CSV file of something you care about, and draw one chart.',auto:'**Your goal, automation:** write a script that tidies a messy folder by file type, using ~pathlib~.',ai:'**Your goal, AI:** learn NumPy first, then try scikit-learn, and later call an AI model API from a small script.',explore:'**Your goal, exploring:** keep it playful. Try a small game with pygame or a text adventure with ~match~.'}[S.goal];
    html+='<div class="tip">'+inline(extra)+'</div>';
  }
  html+='<div class="check-block"><h3 class="s">Check yourself</h3>'+l.checks.map((q,i)=>qBlock(ctx+':'+l.id+':'+i,q)).join('')+'</div>';
  if(l.task){
    const k=ctx+':sol:'+l.id;
    html+='<div class="task"><h3>Practice</h3><p style="margin:0">'+inline(l.task).replace(/\n/g,'<br>')+'</p>'
    +(l.sol?'<p style="margin:12px 0 0"><button class="btn ghost small" data-a="togsol" data-k="'+k+'">'+(S.open[k]?'Hide sample solution':'Show sample solution')+'</button></p>'+(S.open[k]?'<p class="muted" style="margin:10px 0 0;font-size:.95rem">Try it yourself first. Yours can look different and still be right.</p>'+codeBlock(l.sol,'py'):''):'')
    +'</div>';
  }
  html+='<div class="donebar"><button class="btn'+(isDone?' ghost':'')+'" data-a="done" data-id="'+l.id+'">'+(isDone?'Finished. Undo':'Mark this lesson finished')+'</button>'+(isDone?'<span class="fam" style="color:var(--green);font-weight:700">Lesson complete</span>':'')+'</div></article>';
  return html;
}

function warmup(n,session){
  const pool=[];
  for(const l of LESSONS){
    if(!S.done[l.id]||session.includes(l.id))continue;
    l.checks.forEach((q,i)=>pool.push({l:l,q:q,i:i}));
  }
  if(pool.length<2)return '';
  const a=pool[(n*5+1)%pool.length];let b=pool[(n*5+4)%pool.length];
  if(b===a)b=pool[(n*5+2)%pool.length];
  return '<section class="warm"><h3 class="s">Warm-up: two questions from earlier</h3><p class="muted" style="margin:0 0 4px;font-size:.98rem">Recalling what you learned is what makes it stick.</p>'
   +[a,b].map(p=>qBlock('w'+n+':'+p.l.id+':'+p.i,p.q)).join('')+'</section>';
}

function vSession(){
  const n=V.n,s=S.plan[n];
  if(!s)return vPlan();
  const dates=sessionDates(S.plan.length,S.perWeek,S.start||todayIso());
  const mins=s.reduce((a,id)=>a+LBY[id].min,0);
  const allDone=s.every(id=>S.done[id]);
  let html='<div class="narrow" style="max-width:820px"><p class="crumbs"><button class="link" data-a="plan">My plan</button> / Session '+(n+1)+' of '+S.plan.length+'</p>'
  +'<h2 class="t">Session '+(n+1)+'</h2><p class="muted fam">'+fmtDate(dates[n])+' · about '+fmtMin(mins)+' · '+s.length+' lesson'+(s.length>1?'s':'')+'</p>';
  html+=warmup(n,s);
  html+=s.map(id=>lessonHTML(LBY[id],'s')).join('');
  if(allDone){
    const last=n===S.plan.length-1;
    html+='<div class="win"><h3>'+(last?'Course complete.':'Session complete.')+'</h3><p>'+(last?'You built a real program and learned the foundations of Python. Be proud of that.':'Nice work. Come back for the next session and start with its warm-up. Rest is part of learning.')+'</p><button class="btn" data-a="plan">Back to my plan</button></div>';
  }
  return html+'</div>';
}
function vLesson(){
  const l=LBY[V.id];
  return '<div class="narrow" style="max-width:820px"><p class="crumbs"><button class="link" data-a="plan">My plan</button> / Refresher</p>'+lessonHTML(l,'r')+'</div>';
}

function render(keep){
  const y=window.scrollY;
  let html;
  switch(V.name){
    case 'home':html=vHome();break;
    case 'profile':html=vProfile();break;
    case 'quiz':html=vQuiz();break;
    case 'setup':html=vSetup();break;
    case 'plan':html=vPlan();break;
    case 'session':html=vSession();break;
    case 'lesson':html=vLesson();break;
    default:html=vHome();
  }
  $app.innerHTML=html;
  renderMini();
  window.scrollTo(0,keep?y:0);
}

/* ============ EVENTS ============ */
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  switch(a){
    case 'home':go(S.plan?'plan':'home');break;
    case 'plan':V.replan=false;go('plan');break;
    case 'start':go('profile');break;
    case 'brandnew':S.answers={};S.skip=[];save();V.replan=false;go('setup');break;
    case 'exp':S.exp=t.dataset.v;save();update();break;
    case 'goal':S.goal=t.dataset.v;save();update();break;
    case 'beginquiz':S.answers={};V.qi=0;go('quiz');break;
    case 'opt':{
      const p=PLACEMENT[V.qi];S.answers[p.id]=parseInt(t.dataset.i,10);save();
      if(V.qi<PLACEMENT.length-1){V.qi++;render(false)}
      else{S.skip=computeSkip();save();V.replan=false;go('setup')}
      break;}
    case 'qback':if(V.qi>0){V.qi--;render(false)}break;
    case 'togskip':{
      const id=t.dataset.t;
      S.skip=S.skip.includes(id)?S.skip.filter(x=>x!==id):S.skip.concat(id);save();update();break;}
    case 'minutes':S.minutes=parseInt(t.dataset.v,10);save();update();break;
    case 'perweek':S.perWeek=parseInt(t.dataset.v,10);save();update();break;
    case 'build':{
      const ids=V.replan?remainingIds():activeIds();
      S.plan=pack(ids,S.minutes);S.start=todayIso();V.replan=false;save();go('plan');break;}
    case 'opensession':V.n=parseInt(t.dataset.n,10);go('session');break;
    case 'openlesson':V.id=t.dataset.id;go('lesson');break;
    case 'pick':S.picks[t.dataset.k]=parseInt(t.dataset.i,10);save();update();break;
    case 'togsol':S.open[t.dataset.k]=!S.open[t.dataset.k];save();update();break;
    case 'done':S.done[t.dataset.id]=!S.done[t.dataset.id];save();update();break;
    case 'replan':V.replan=true;go('setup');break;
    case 'retake':S.answers={};V.qi=0;V.replan=false;go('profile');break;
    case 'askreset':V.confirm=true;update();break;
    case 'cancelreset':V.confirm=false;update();break;
    case 'reset':S=defaults();save();V.replan=false;go('home');break;
  }
});
render(false);
